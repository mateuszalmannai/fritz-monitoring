global:
  scrape_interval: 60s
  evaluation_interval: 60s

scrape_configs:
  - job_name: fritz-exporter
    scrape_interval: 60s
    # Raise to ~45s if you enable FRITZ_HOST_INFO.
    scrape_timeout: 30s
    static_configs:
      - targets: ["fritz-exporter:9787"]

  # Our own add-on: serves cached values (it polls the box itself every 2-5 min), so scrapes are instant.
  - job_name: fritz-extras
    scrape_timeout: 10s
    static_configs:
      - targets: ["fritz-extras:9788"]
        labels:
          instance: fritzbox

  - job_name: pihole
    static_configs:
      - targets: ["pihole-exporter:9617"]
        labels:
          instance: pihole

  # Each scrape runs a full speed test (~30 s, ~250 MB), hence the long interval.
  - job_name: speedtest
    scrape_interval: 8h
    scrape_timeout: 100s
    static_configs:
      - targets: ["speedtest-exporter:9798"]
        labels:
          instance: speedtest

  # The Pi itself. node-exporter runs in the host network on docker0.
  - job_name: node
    static_configs:
      - targets: ["host.docker.internal:9100"]
        labels:
          instance: cornholio

  # Blackbox probes: the target is passed to the exporter as ?target=...
  - job_name: blackbox-icmp
    metrics_path: /probe
    params:
      module: [icmp]
    static_configs:
      - targets:
          - 192.168.178.1   # FRITZ!Box
          - 1.1.1.1         # Cloudflare
          - 9.9.9.9         # Quad9
    relabel_configs: &blackbox_relabel
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox-dns
    metrics_path: /probe
    params:
      module: [dns_example]
    static_configs:
      - targets:
          - pihole:53          # Pi-hole (what the LAN uses)
          - 192.168.178.1:53   # FRITZ!Box (Pi-hole's upstream), for comparison
    relabel_configs: *blackbox_relabel

  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          # Tiny endpoints on purpose: the probe runs every minute, and full
          # home pages cost ~2 GB/day (cloudflare.com alone is 1.3 MB).
          - https://www.google.com/generate_204       # empty 204 reply
          - https://www.cloudflare.com/cdn-cgi/trace  # ~300 bytes
    relabel_configs: *blackbox_relabel
